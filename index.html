<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ellegria</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #ef0000;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 20px;
    }

    .logo-container {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      flex: 1;
    }

    .logo {
      width: 80%;
      max-width: 500px;
      height: auto;
    }

    footer {
      width: 100%;
      max-width: 400px;
      background: white;
      border-radius: 25px;
      padding: 15px 10px;
      margin-bottom: env(safe-area-inset-bottom);
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
      display: flex;
      justify-content: center;
      gap: 25px;
      flex-wrap: wrap;
    }

    footer a {
      text-decoration: none;
      color: #ef0000;
      font-weight: 600;
      font-size: 14px;
    }

    footer a:hover {
      text-decoration: underline;
    }

    @media (max-width: 480px) {
      .logo {
        width: 100%;
        max-width: 320px;
      }

      footer {
        padding: 12px;
        border-radius: 20px;
      }

      footer a {
        font-size: 13px;
      }
    }
  </style>
</head>

<body>

  <div class="logo-container">
    <img src="Screenshot 2026-02-26 094334.png" alt="Logo" class="logo">
  </div>

  <footer>
    <a href="impressum_socialmedia_ellegria_de.pdf">Impressum</a>
    <a href="datenschutzerklaerung_socialmedia_ellegria_de.pdf">Datenschutzerklärung</a>
  </footer>

</body>
</html>
